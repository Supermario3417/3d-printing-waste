<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Milestone Presentations · 3D Printing Waste</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Fira+Sans:wght@500;600;800&amp;family=Barlow+Condensed:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" />
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/layout.css" />
        <link rel="stylesheet" href="../../css/navigation.css" />
        <link rel="stylesheet" href="../../css/responsive.css" />
        <link rel="stylesheet" href="../../features/milestones/milestones.css" />

        <link rel="icon" href="../../images/favicon.ico">
    </head>
    <body data-current-page="milestones" data-base-path="../../">
        <div id="site-navigation"></div>
        <main id="main-content">
            <div class="wrap milestones-layout">
                <section class="presentation-selection" aria-labelledby="presentation-list-title">
                    <h2 id="presentation-list-title">Presentations</h2>
                    <ul class="presentation-list" id="presentation-list"></ul>
                </section>
                <section class="display" aria-label="Presentation viewer">
                    <div class="viewer-heading">
                        <h2 id="presentation-title">Choose a presentation</h2>
                        <span class="slide-count" id="slide-count"></span>
                    </div>
                    <div class="slide-frame">
                        <img class="slide-image" id="slide-image" alt="" hidden />
                        <div class="presentation-loader" id="presentation-loader" role="status" aria-live="polite" hidden>
                            Loading presentation…
                        </div>
                        <button class="slide-control previous-slide" id="previous-slide" type="button" aria-label="Previous slide" disabled>‹</button>
                        <button class="slide-control next-slide" id="next-slide" type="button" aria-label="Next slide" disabled>›</button>
                        <button class="fullscreen-control" id="fullscreen-control" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
                    </div>
                    <p class="viewer-status" id="viewer-status" role="status" aria-live="polite">Choose a presentation to begin.</p>
                </section>
            </div>
        </main>
        <div id="site-footer"></div>
        <script src="../../js/navigation.js" defer="defer"></script>
        <script src="../../js/milestones.js" defer="defer"></script>
    </body>
</html>
